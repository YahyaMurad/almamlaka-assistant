services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mamlaka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mamlaka
      POSTGRES_PASSWORD: mamlaka
      POSTGRES_DB: mamlaka
    ports:
      - "5433:5432"
    volumes:
      - mamlaka_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mamlaka"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mamlaka-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://mamlaka:mamlaka@postgres:5432/mamlaka
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - mamlaka_backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: mamlaka-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mamlaka_postgres_data:
  mamlaka_backend_storage:
